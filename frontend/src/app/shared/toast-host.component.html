<div class="fixed top-5 right-5 z-50 flex w-[360px] max-w-[92vw] flex-col gap-2">
  <ng-container *ngIf="toasts | async as list">
    <div *ngFor="let t of list" class="toast-enter glass soft-shadow rounded-2xl px-4 py-3">
      <div class="flex items-start gap-3">
        <div class="mt-0.5 h-2.5 w-2.5 rounded-full"
             [class.bg-emerald-400]="t.kind === 'success'"
             [class.bg-rose-400]="t.kind === 'error'"
             [class.bg-sky-400]="t.kind === 'info'"></div>
        <div class="flex-1">
          <div class="text-sm font-semibold"
               [class.text-emerald-200]="t.kind === 'success'"
               [class.text-rose-200]="t.kind === 'error'"
               [class.text-sky-200]="t.kind === 'info'">
            {{ t.message }}
          </div>
        </div>
        <button class="btn btn-ghost h-8 w-8 px-0 rounded-xl" (click)="dismiss(t.id)">×</button>
      </div>
    </div>
  </ng-container>
</div>
