<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clientes</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>

  <link href="/styles.css" rel="stylesheet" />
</head>

<body class="app-bg">
  
  <nav class="navbar navbar-expand-lg navbar-dark app-nav shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Gestión de clientes</a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <div class="input-group input-group-sm">
          <span class="input-group-text">Estado</span>
          <select class="form-select" id="filtroEstado">
            <option value="activos" selected>Activos</option>
            <option value="todos">Todos</option>
            <option value="inactivos">Inactivos</option>
          </select>
        </div>

        <button class="btn btn-sm btn-light" id="btnNuevo">Nuevo</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
          <div>
            <h1 class="h5 mb-1">Listado</h1>
            <div class="text-secondary small">Crea, edita, desactiva y reactiva clientes.</div>
          </div>

          <div class="d-flex align-items-center gap-2">
            <span class="badge text-bg-success">Activo</span>
            <span class="badge text-bg-secondary">Inactivo</span>
          </div>
        </div>

        <div class="table-responsive">
          <table id="tablaClientes" class="table table-hover align-middle w-100">
            <thead>
              <tr>
                <th>ID</th>
                <th>Cédula</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Ciudad</th>
                <th>Cantón</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th style="width: 170px;">Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  
  <div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <div id="formMsg" class="alert alert-danger d-none"></div>
          <input type="hidden" id="idCliente" />

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Cédula</label>
              <input id="cedula" class="form-control" maxlength="10" placeholder="10 dígitos" />
              <div class="form-text">Opcional, pero si la ingresas debe ser válida.</div>
            </div>

            <div class="col-md-4">
              <label class="form-label">Nombres <span class="text-danger">*</span></label>
              <input id="nombres" class="form-control" maxlength="80" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Apellidos <span class="text-danger">*</span></label>
              <input id="apellidos" class="form-control" maxlength="80" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Fecha de nacimiento</label>
              <input id="fechaNacimiento" type="date" class="form-control" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Teléfono</label>
              <input id="telefono" class="form-control" maxlength="10" placeholder="09XXXXXXXX" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input id="email" type="email" class="form-control" maxlength="120" placeholder="correo@dominio.com" />
            </div>

            <div class="col-md-12">
              <label class="form-label">Dirección</label>
              <input id="direccion" class="form-control" maxlength="200" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Ciudad <span class="text-danger">*</span></label>
              <select id="ciudadId" class="form-select"></select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Cantón <span class="text-danger">*</span></label>
              <select id="cantonId" class="form-select"></select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Tipo <span class="text-danger">*</span></label>
              <select id="tipoClienteId" class="form-select"></select>
            </div>

            <div class="col-12">
              <div class="form-check">
                <input id="activo" class="form-check-input" type="checkbox" checked />
                <label class="form-check-label" for="activo">Activo</label>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btnGuardar">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  
  <div class="modal fade" id="modalConfirm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title" id="confirmTitulo">Confirmar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="confirmTexto" class="mb-0"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="btnConfirmarAccion">Continuar</button>
        </div>
      </div>
    </div>
  </div>

  
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

  <script src="/app.js"></script>
</body>
</html>
